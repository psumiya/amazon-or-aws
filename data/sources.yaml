# Every source URL is pinned here. Edit to add or remove sources, then run
#   python -m site_builder.fetch && python -m site_builder.build
#
# role decides where a feed appears on the News page:
#   river     merged "Latest" column
#   launches  the compact launches rail
#   videos    the video rail

max_items: 30

feeds:
  - id: aws-news-blog
    name: AWS News Blog
    url: https://aws.amazon.com/blogs/aws/feed/
    role: river
  - id: aws-architecture
    name: AWS Architecture Blog
    url: https://aws.amazon.com/blogs/architecture/feed/
    role: river
  - id: last-week-in-aws
    name: Last Week in AWS
    url: https://www.lastweekinaws.com/feed/
    role: river
  - id: whats-new
    name: What's New with AWS
    url: https://aws.amazon.com/about-aws/whats-new/recent/feed/
    role: launches
  - id: aws-youtube
    name: AWS on YouTube
    url: https://www.youtube.com/feeds/videos.xml?channel_id=UCd6MoB9NC6uYN2grvUNT-Zg
    role: videos

services:
  url: https://aws.amazon.com/api/dirs/items/search?item.directoryId=aws-products&sort_by=item.additionalFields.launchDate&sort_order=asc&size=500&item.locale=en_US&tags.id=aws-products%23type%23service&tags.id=!aws-products%23type%23variant
