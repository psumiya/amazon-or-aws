name: Daily refresh

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ["data/feeds/**", "data/services.json"]
  # Daily at 13:17 UTC (05:17 PST, 06:17 PDT).
  schedule:
    - cron: "17 13 * * *"

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Fetch sources
        run: python -m site_builder.fetch
      - name: Commit data
        run: |
          git config user.name "amazonoraws-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Data $(date -u +%F)"
          git push
      - run: python -m site_builder.build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
